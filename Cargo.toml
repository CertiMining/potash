# Cargo workspace for CertiMining (D-04). Library crates live under crates/, Solana programs under programs/.
[workspace]
resolver = "2"
members = ["crates/certimining-core", "programs/core-harness", "xtask"]
# A plain `cargo test` covers the core crate. The harness needs a Solana build first; scripts/ci.sh runs
# it. xtask is a host-only tool (D-54), kept out of default-members so the bare-metal builds that prove
# no_std (D-14) still compile the core crate alone.
default-members = ["crates/certimining-core"]
