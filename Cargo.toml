# Cargo workspace for CertiMining (D-04). Library crates live under crates/, Solana programs under programs/.
[workspace]
resolver = "2"
members = [
    "crates/certimining-client",
    "crates/certimining-core",
    "crates/certimining-log",
    "programs/certimining-checkpoint",
    "programs/core-harness",
    "xtask",
]
# A plain `cargo test` covers the two engine crates, both `no_std` (D-61). The harness needs a Solana
# build first; scripts/ci.sh runs it. xtask is a host-only tool (D-54), kept out of default-members so
# the bare-metal builds that prove no_std (D-14) still name their crate with `-p`.
default-members = ["crates/certimining-core", "crates/certimining-log"]
