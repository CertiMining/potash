[package]
name = "certimining-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
# No licence is declared until E-15 decides it (D-13).
publish = false
description = "Publishes checkpoints on the epoch cadence and fetches a root by epoch without an indexer (TCU-02 §2.3, §1.5). The only crate here that speaks to a cluster."

[lints.rust]
unsafe_code = "forbid"

[features]
# The default build talks to nothing: `RootSource` is a trait and every test below implements it with
# a map, so a cluster is never needed to check the client's own decisions (D-84). `cluster` adds the
# one implementation that does reach a network, on the Agave 4.2.2 line the deployment runs (D-15).
default = []
ots = ["dep:opentimestamps", "dep:bitcoin_hashes"]
cluster = [
    "dep:solana-rpc-client",
    "dep:solana-commitment-config",
    "dep:solana-pubkey",
    "dep:solana-instruction",
    "dep:solana-message",
    "dep:solana-transaction",
    "dep:solana-signer",
    "dep:solana-keypair",
    # H-35 (#82): binding a publication's slot readings to one chain. `solana-signature` parses the
    # signature a status is asked about, `solana-rpc-client-api` carries `getSlot`'s own
    # `RpcContextConfig`, and `serde_json` sends the request the typed client has no method for. All
    # three are already in the lock file — the first two as `solana-rpc-client`'s own dependencies and
    # the third as this crate's test dependency — so no crate enters the graph that the licence and
    # advisory gates had not already cleared.
    "dep:solana-signature",
    "dep:solana-rpc-client-api",
    "dep:serde_json",
    # H-13: the batcher signs the handoff, which needs the signer and not only the verifier. Already a
    # test dependency of this crate — the handoff's own tests sign with it — so the `cluster` feature
    # promotes a crate the licence and advisory gates had already cleared.
    "dep:ed25519-dalek",
]

[[bin]]
# The anchor-B worker (H-13, D-139). Behind the same features as the module it drives, so the default
# build and every test above it stay free of a network and of a key.
name = "anchor-b-worker"
path = "src/bin/anchor-b-worker.rs"
required-features = ["cluster", "ots"]

[[bin]]
# The batcher (H-13, D-117, D-139): builds an epoch and signs the handoff the worker publishes. Behind
# the same features as the worker although it reaches no network, because what the gate is for is
# keeping keys and networks out of the default build, and this process holds two keys.
name = "batcher-handoff"
path = "src/bin/batcher-handoff.rs"
required-features = ["cluster", "ots"]

[[bin]]
# Confirming a receipt against Bitcoin (H-12). No cluster: it reads a receipt, the bytes it stamped
# and a file of headers, so it needs no network and no key at all.
name = "confirm-anchor-b"
path = "src/bin/confirm-anchor-b.rs"
required-features = ["ots"]

[dependencies]
# The engine: digests, the tree and the promise types (D-84).
certimining-core = { path = "../certimining-core", features = ["native"] }
certimining-log = { path = "../certimining-log", features = ["native"] }
# The program's account layouts and address, so the client derives what the program writes rather
# than a second opinion about it. `no-entrypoint` keeps the program's entrypoint out of this build.
certimining-checkpoint = { path = "../../programs/certimining-checkpoint", features = ["no-entrypoint"] }
# Anchor's account types for deserialising what the program wrote, and its Pubkey/PDA derivation.
anchor-lang = "=1.2.0"
# The cluster-facing half, on the line the deployment runs (D-15). Optional, so the default build and
# every test stay free of a network.
solana-rpc-client = { version = "=4.2.2", default-features = false, optional = true }
solana-commitment-config = { version = "=3.1.1", optional = true }
solana-pubkey = { version = "=3.0.0", optional = true }
# Building and signing the publish transaction, which §2.3's `publish` has to do itself (D-110).
# Already in the lock file as test dependencies; the `cluster` feature promotes them, so no crate
# enters the graph that the licence and advisory gates had not already seen.
solana-instruction = { version = "=3.4.1", optional = true }
solana-message = { version = "=4.4.1", optional = true }
solana-transaction = { version = "=4.1.6", optional = true }
solana-signer = { version = "=3.0.1", optional = true }
# The worker holds the checkpoint authority and a payer, so it needs the concrete signer rather than
# the trait. Already in the graph as a test dependency; the `cluster` feature promotes it, the way it
# promotes the transaction crates above.
solana-keypair = { version = "=3.1.2", optional = true }
solana-signature = { version = "=3.4.1", optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, optional = true }
solana-rpc-client-api = { version = "=4.2.2", default-features = false, optional = true }
serde_json = { version = "=1.0.151", optional = true }

# Anchor B's receipts (D-115). This crate parses and verifies a receipt and cannot create one; the
# reference client creates, and this checks what it produced before anything hashes it.
opentimestamps = { version = "=0.2.0", optional = true }
# SHA-256, for the one place anchor B forces it: an OTS receipt commits to the SHA-256 of the file
# it stamped, so verifying that a receipt is this epoch's means computing that digest (D-119).
# Already in the graph as `opentimestamps`' own dependency, so no crate arrives that the gate had
# not already cleared.
bitcoin_hashes = { version = "=0.12.0", optional = true }

[dev-dependencies]
# Keccak-256, so §2.4's receipt-digest construction is transcribed from the specification in the
# test rather than taken from the function under test. Already in the graph through the engine.
sha3 = "=0.10.8"
# Signing handoffs in tests (D-139). The verifier under test is `DalekVerifier`; the tests need the
# other half to produce a signature to verify. Same pin as the engine's (D-39), and already in the
# graph through certimining-core's `native` feature, so no crate arrives that the licence and
# advisory gates had not already seen.
ed25519-dalek = { version = "=2.2.0", default-features = false }
# The cluster stand-in for tests that need one; the RPC itself is behind a trait (D-84).
litesvm = "=0.16.0"
# Reading V-P-12, the only vector this crate consumes: §2.4's program addresses, which the client
# derives and the vector states. Already in the lock file for xtask, so no crate enters the graph
# that the licence and advisory gates had not already seen. JSON stays out of the library (D-57).
serde_json = "=1.0.151"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-pubkey = "=3.0.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.6"
