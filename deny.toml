# Dependency policy (D-13), checked in CI by `scripts/ci.sh deny`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every advisory class covers the whole graph, transitive crates included (D-18). Without this,
# cargo-deny 0.20.2 checks unsound advisories in workspace crates only (S9-01). unmaintained already
# defaults to "all"; it is stated so the policy rests on no implicit scope.
unmaintained = "all"
unsound = "all"
# **Two kinds of exception now, and the second is dated (D-142, owner's ruling of 31 October 2026).**
# The first five are unmaintained advisories the test runtime alone reaches (D-18). The five below
# them are vulnerability and unsound advisories in the Solana dependency stack, which this repository
# cannot move: each fix is a semver-major bump that only upstream can take, so `cargo update` reports
# "Locking 0 packages" for all three crates. Yanked advisories still take no exceptions.
#
# **Every dated entry carries four things**, which is what makes it a decision rather than a silence:
# the dependency path, whether the vulnerable code is reached in our use and the evidence for that
# answer, an expiry, and the condition that retires it. D-142 holds the long form. Adding a line here
# is a decision in docs/DECISIONS.md, never a quiet edit.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
  { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
  { id = "RUSTSEC-2021-0139", reason = "ansi_term is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
  { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },

  # ---------------------------------------------------------------------------------------------
  # **crypto-bigint 0.5.5** — fixed in 0.7.6, which elliptic-curve 0.13.8 cannot take.
  #   PATH     crypto-bigint <- elliptic-curve 0.13.8 <- ecdsa 0.16.9 / k256 0.13.4 <- the Solana
  #            stack <- certimining-checkpoint, certimining-client, core-harness.
  #   REACHED  No. The fault is in secp256k1 field arithmetic reached through k256, and nothing in
  #            this workspace calls a secp256k1 operation: `grep -rE '\bsecp256k1\b|\bk256\b|\becdsa\b'`
  #            over crates/ and programs/ returns nothing. The crate is linked because Solana's
  #            syscall surface declares it. This repository signs with Ed25519 and hashes with
  #            Keccak-256.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing variability. PATH elliptic-curve<-k256<-Solana<-our three crates. NOT REACHED: no secp256k1 call anywhere in crates/ or programs/. EXPIRES 2026-12-31. RETIRE when the Solana stack takes crypto-bigint >= 0.7.6 (D-142)" },

  # ---------------------------------------------------------------------------------------------
  # **zstd 0.13.3 and zstd-safe 7.3.0** — ten advisories, fixed in zstd 0.14.3 and zstd-safe 8.2.0,
  # neither of which solana-account-decoder 4.2.2 can take.
  #
  #   PATH     zstd / zstd-safe <- solana-account-decoder-client-types 4.2.2 <- solana-rpc-client
  #            4.2.2 <- certimining-client, **under the `cluster` feature only**. `default = []`, so
  #            the verifier build a counterparty runs never compiles any of it.
  #
  #   THE ONE PATH THAT IS REACHED, stated so the rest can be read against it. The typed blocking
  #   client hardcodes `UiAccountEncoding::Base64Zstd` in `get_account_with_commitment` and
  #   `get_multiple_accounts_with_commitment`, which is why this workspace meets zstd at all.
  #   **Corrected 1 Nov 2026 (H-83, #282): it does expose a way round, and this comment said it did
  #   not.** `send<T>` is public at `rpc_client.rs:1008`, and two methods take an
  #   `RpcAccountInfoConfig` at `rpc_client.rs:3183` and `:3337`. Requesting plain base64 is possible;
  #   what it costs is leaving the two commitment helpers this workspace calls, which is a cost
  #   judgment and not an impossibility. The response is decoded by `UiAccountData::decode` in
  #   solana-account-decoder-client-types 4.2.2, which builds a **fresh**
  #   `zstd::stream::read::Decoder` **per account** and reads it to end — `getMultipleAccounts`
  #   decodes each account it returns, so it is per account and not per response.
  #   of this workspace's zstd surface. `legacy` and `zdict_builder` are compiled in, by those
  #   crates' defaults; compiled is not called.
  #
  #   Each line below says why that surface does not meet the advisory's precondition.
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3, data from an abandoned stream leaking on a REUSED CONTEXT. NOT REACHED: a fresh read::Decoder is built per response and read to end; no context is reused across streams. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd >= 0.14.3 (D-142)" },
  { id = "RUSTSEC-2026-0395", reason = "zstd-safe 7.3.0, use-after-free with CParameter::StableInBuffer. NOT REACHED: a compression parameter on a decompression path, and zstd 0.13.3 sets only CParameter::CompressionLevel. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0396", reason = "zstd-safe 7.3.0, Seekable reads a NULL or out-of-bounds seek table. NOT REACHED: `Seekable` appears nowhere in zstd 0.13.3's source. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0397", reason = "zstd-safe 7.3.0, OutBuffer::around_pos exposes uninitialised memory. NOT REACHED: `around_pos` appears nowhere in zstd 0.13.3's source. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.3.0, Seekable::decompress sets a Vec length beyond capacity. NOT REACHED: `Seekable` appears nowhere in zstd 0.13.3's source. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0399", reason = "zstd-safe 7.3.0, use-after-free through init_using_cdict and init_using_ddict. NOT REACHED: read::Decoder::new takes no dictionary; it calls DCtx::in_size and with_buffer only. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0400", reason = "zstd-safe 7.3.0, use-after-free of a DICTIONARY after a one-shot call on a context with an open stream. NOT REACHED: no dictionary is ever loaded on this path. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0401", reason = "zstd-safe 7.3.0, out-of-bounds read in train_from_buffer. NOT REACHED: dictionary training; zdict_builder is compiled in by a dependency default but nothing here calls it. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0402", reason = "zstd-safe 7.3.0, heap buffer overflow in CCtx::try_clone on a multithreaded context. NOT REACHED: a compression context on a decompression path, never cloned. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  # The one that needed reading rather than reasoning: legacy support IS compiled in and this
  # workspace does stream decompression of remote data, so the precondition looked met. The advisory
  # states outright that `zstd::stream::read::Decoder`, `zstd::decode_all` and the bulk API are not
  # affected — only `stream::write::Decoder` is, and nothing here uses it.
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.3.0, uninitialised memory when streaming decompression of a LEGACY frame fails. NOT REACHED: the advisory excludes stream::read::Decoder, which is the only decoder on this path; the fault is in stream::write::Decoder. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0404", reason = "zstd-safe 7.3.0, double free in DCtx::try_clone. NOT REACHED: neither try_clone nor InBuffer::new appears in zstd 0.13.3's read module; a decoder is created and dropped, never cloned. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0405", reason = "zstd-safe 7.3.0, out-of-bounds read with an out-of-range InBuffer::pos. NOT REACHED: nothing here constructs an InBuffer; read::Decoder owns its buffers and sets pos itself. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  { id = "RUSTSEC-2026-0406", reason = "zstd-safe 7.3.0, use-after-free when changing a MULTITHREADED context with an unfinished frame. NOT REACHED: a multithreaded compression context on a single-shot decompression path. EXPIRES 2026-12-31. RETIRE when the Solana stack takes zstd-safe >= 8.2.0 (D-142)" },
  # wasm32 only, and this repository builds the host, thumbv7em-none-eabihf and SBF. No wasm target
  # appears in scripts/ci.sh at all.
]

[licenses]
version = 2
# **No copyleft, and LGPL is not an exception to that (owner, 12 Oct 2026, H-16).** The list below is
# the whole policy: a crate whose licence is not on it fails, and a reciprocal licence does not get a
# per-crate exception the way CDLA-Permissive-2.0 and NCSA do below. The two exceptions are permissive
# licences that `cargo deny` could not match automatically; neither widens this list.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]
confidence-threshold = 0.9
# This project's own crates declare no licence until E-15 decides it (D-13).
private = { ignore = true }

# One crate, one licence, and not a global allow (D-89). `webpki-roots` bundles Mozilla's CA root
# certificate **data**, which is licensed CDLA-Permissive-2.0; the crate's own code is MIT. It reaches
# this workspace through the cluster client and nothing else:
#     certimining-client -> solana-rpc-client 4.2.2 -> reqwest -> hyper-rustls -> webpki-roots
# Scoping it here means a second crate arriving under the same licence still fails the gate, which is
# how this one was found.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# One crate, one licence, same shape (D-89, D-135). `libfuzzer-sys` is §4.5's fuzzing driver and lives
# in `fuzz/`, its own Cargo workspace, which `cargo deny` reaches only because `scripts/ci.sh deny`
# points at that manifest explicitly. It is not in the shipped workspace: nothing depends on
# `certimining-fuzz`, and neither it nor `arbitrary` appears in the graph of the client, the engine
# crates or the program, so it reaches nothing a user runs.
#
# **Two licence statements disagree, and both are permissive, which is why this is an exception rather
# than a wider allow.** The crate declares `(MIT OR Apache-2.0) AND NCSA` at its `Cargo.toml:25` and
# repeats NCSA in its `README.md:101`. The vendored LLVM sources say otherwise, and a review corrected the
# population this record named (PR #55, E12-05). Against the locked 0.4.10 source:
#
#   find libfuzzer -type f \( -name '*.cpp' -o -name '*.h' \) | wc -l                    # 53
#   find libfuzzer -type f \( -name '*.cpp' -o -name '*.h' \) \
#     -exec grep -l 'SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception' {} \; | wc -l  # 53
#   ls libfuzzer/*.cpp | wc -l                                                           # 26, the set
#                                                                                        # build.rs compiles
#   grep -ril 'NCSA' . --include='*.cpp' --include='*.h' | wc -l                          # 0
#
# So: 53 `.cpp` and `.h` files in the crate, every one carrying `Apache-2.0 WITH LLVM-exception`, and no
# NCSA licence text anywhere in them. `build.rs` compiles **26** of those — the top-level `.cpp` only,
# because its `read_dir("libfuzzer")` does not recurse, so the sources under `afl/`, `dataflow/` and
# `tests/` are shipped and not built. An earlier version of this note said "all 47", which was the
# top-level `.cpp` and `.h` together: neither the crate's population nor the compiled set, and not
# reproducible from the locked package as written.
#
# Which statement governs is a legal question and not one this file settles. NCSA is what has to be
# allowed because `cargo deny` reads the declaration; the headers are recorded because they are what the
# compiled code carries.
#
# Scoped to this crate, so a second crate arriving under NCSA still fails the gate.
#
# Both graphs read this one file, so each run reports the other's exception as
# `license-exception-not-encountered`: the workspace run says this one is unmatched, the fuzz run says
# `webpki-roots` is. Warnings, not failures, and the symmetry is the cost of one policy over two graphs.
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA", "Apache-2.0 WITH LLVM-exception"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
