# Dependency policy (D-13), checked in CI by `scripts/ci.sh deny`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every advisory class covers the whole graph, transitive crates included (D-18). Without this,
# cargo-deny 0.20.2 checks unsound advisories in workspace crates only (S9-01). unmaintained already
# defaults to "all"; it is stated so the policy rests on no implicit scope.
unmaintained = "all"
unsound = "all"
# Exactly these five, and only because the test runtime alone reaches them (D-18). Vulnerability,
# unsound and yanked advisories take no exceptions, and any advisory not listed here fails CI.
# Adding a line here is a decision in docs/DECISIONS.md, never a quiet edit.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
  { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
  { id = "RUSTSEC-2021-0139", reason = "ansi_term is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
  { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained; reached only through litesvm, the test runtime, never shipped (D-18)" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]
confidence-threshold = 0.9
# This project's own crates declare no licence until E-15 decides it (D-13).
private = { ignore = true }

# One crate, one licence, and not a global allow (D-89). `webpki-roots` bundles Mozilla's CA root
# certificate **data**, which is licensed CDLA-Permissive-2.0; the crate's own code is MIT. It reaches
# this workspace through the cluster client and nothing else:
#     certimining-client -> solana-rpc-client 4.2.2 -> reqwest -> hyper-rustls -> webpki-roots
# Scoping it here means a second crate arriving under the same licence still fails the gate, which is
# how this one was found.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# One crate, one licence, same shape (D-89, D-135). `libfuzzer-sys` is §4.5's fuzzing driver and lives
# in `fuzz/`, its own Cargo workspace, which `cargo deny` reaches only because `scripts/ci.sh deny`
# points at that manifest explicitly. It is not in the shipped workspace: nothing depends on
# `certimining-fuzz`, and neither it nor `arbitrary` appears in the graph of the client, the engine
# crates or the program, so it reaches nothing a user runs.
#
# **Two licence statements disagree, and both are permissive, which is why this is an exception rather
# than a wider allow.** The crate declares `(MIT OR Apache-2.0) AND NCSA` at its `Cargo.toml:25` and
# repeats NCSA in its `README.md:101`. The vendored LLVM sources it actually compiles say otherwise:
# all 47 `.cpp` and `.h` files under `libfuzzer/`, the set `build.rs:38` feeds to `cc`, carry
# `SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception`, and the crate ships no NCSA licence text.
# LLVM relicensed away from NCSA before this snapshot. `cargo deny` reads the declaration, so NCSA is
# what has to be allowed here; the file headers are recorded because they are what the compiled code
# carries, and a reader should not have to rediscover the discrepancy.
#
# Scoped to this crate, so a second crate arriving under NCSA still fails the gate.
#
# Both graphs read this one file, so each run reports the other's exception as
# `license-exception-not-encountered`: the workspace run says this one is unmatched, the fuzz run says
# `webpki-roots` is. Warnings, not failures, and the symmetry is the cost of one policy over two graphs.
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA", "Apache-2.0 WITH LLVM-exception"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
