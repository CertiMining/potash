# §4.4a's wall-clock measures as the CI runner performs them (E-13, D-132).
#
# **This is not §4.4a's threshold and must not be read as one.** §4.4a's absolute figures are asserted
# on the reference machine §4.4a names, by `thresholds.rs`. A shared runner is slower and noisier than
# that machine by an amount nobody controls, so asserting §4.4a's numbers there would either flake or be
# loose enough to assert nothing. What CI can do is notice that a measure moved: it compares against the
# figures below and fails past a band.
#
# Every value is `median_ms`, the median of the sampled runs, which is what `band.rs` compares.
#
# **How these were obtained.** They are measured on the runner and committed from a run's own output.
# Until that has happened a value is absent, and `band.rs` fails and prints what it measured rather than
# passing — a baseline nobody has measured would make a gate that cannot fail, which is the defect this
# repository has filed more than once.
#
# `band_percent` is how far above its baseline a measure may drift before the build fails. It is a
# regression detector, not a performance claim.
#
# **50 is a guess, and is recorded as one.** Nobody has yet observed how much these measures vary on
# GitHub's shared runners from one run to the next, so the number is not derived from anything — it is
# wide because a band that flakes gets disabled and a disabled gate is worse than a loose one. Once a few
# runs exist, the spread is visible in their output and this number is set from it. Until then, a failure
# here means "look", not "a regression of at least 50% has occurred".
band_percent = 50.0

# **And it fails on a busy machine, which is H-31 (#72).** Running another test suite alongside it put
# this machine at 19.73 ms against a 19.27 ms limit, with all three measures marginal — unchanged code,
# failing on load. Since D-137 removed §4.4a's wall-clock absolutes this band is the only wall-clock gate
# left, so its calibration is no longer a secondary concern. Until H-31 lands, a failure here on a
# developer machine means "check what else is running" before it means "the code regressed".
#
# **Run off the runner, this gate proves nothing, and that is worth stating.** These figures are one
# machine's. The reference machine is about 1.8x faster, so `scripts/ci.sh bench-band` there measures
# below the baseline and passes without the comparison meaning anything — it cannot fail on a machine
# faster than the one it is calibrated to. It is in `all` because `all` mirrors the push pipeline
# verbatim, and the run that matters is CI's. The figures that gate the reference machine are §4.4a's
# absolutes, asserted by `scripts/ci.sh thresholds`.

# Measured on ubuntu-24.04, GitHub's shared runner, by the bench-band job of CI run 37046282848
# (commit c16b6a5) — the run whose failure printed them, which is the only way an entry gets here.
#
# **One run, and that is worth knowing.** A baseline from a single sample carries that sample's noise.
# It is the honest starting point rather than a better one invented, and it is re-measured if the band
# turns out to flake.
#
# For scale: the reference machine does the chain walk in 7.1 ms and this runner in 12.8 ms, about 1.8x
# slower. That gap is the whole reason D-132 sends §4.4a's absolute figures to the reference machine and
# gives CI a band instead — §4.4a's 10 ms chain-walk threshold would fail outright here, on code that
# meets it.
[measures]
chain_walk_hash_chain_only = 12.8476
epoch_root_256_leaves = 0.3685
inclusion_proof_verify = 0.0041
