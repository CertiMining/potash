# §4.4a's wall-clock measures as the CI runner performs them (E-13, D-132).
#
# **This is not a §4.4a threshold and must not be read as one.** §4.4a carries no wall-clock absolutes
# at all since D-137, and before that they belonged to the reference machine §4.4a names. A shared runner
# is slower and noisier than that machine by an amount nobody controls, so asserting fixed numbers there
# would either flake or be loose enough to mean nothing. What CI can do is notice that a measure moved: it
# compares against the figures below and **reports** what it finds past a band.
#
# Every value is `median_ms`, the median of the sampled runs, which is what `band.rs` compares.
#
# **How these were obtained.** They are measured on the runner and committed from a run's own output.
# Until that has happened a value is absent, and `band.rs` fails and prints what it measured rather than
# passing — a baseline nobody has measured would make a gate that cannot fail, which is the defect this
# repository has filed more than once.
#
# `band_percent` is how far above its baseline a measure may drift before `band.rs` **fails**. It is a
# regression detector, not a performance claim.
#
# **15, derived from 30 CI runs on 22 October 2026 (H-47, issue #162).** It was 50 and that 50 was
# recorded as a guess: nobody had observed how much these measures vary on GitHub's shared runners, so
# the number came from nothing, and it flaked on a pull request containing no Rust at all. The owner made
# the comparison report-only on 12 October and named the way back — at least twenty runs, the band set
# from the measured spread, the derivation recorded, the assertion restored. Here is the derivation.
#
# **The series.** Every `bench-band` job log from the 30 most recent runs that reached one, over 30
# distinct commits between 20 October 23:48 and 22 October 13:59 UTC. Three measures each, 90 samples.
#
# **What they show, as a ratio to the baselines below.**
#
#     measure                      min     median   max     worst above baseline
#     chain_walk_hash_chain_only   0.591    0.997   1.005   +0.5%
#     epoch_root_256_leaves        0.588    0.990   1.004   +0.4%
#     inclusion_proof_verify       0.610    1.000   1.024   +2.4%
#
# **No measure has ever exceeded its baseline by more than 2.4%**, and that worst case is
# `inclusion_proof_verify`, which runs in 4 µs where a single quantisation step is about that much. The
# two measures above 0.3 ms never exceed +0.5%. The 50% band was twenty times wider than the widest
# excursion the runners actually produce.
#
# **The fleet is mixed, and that is why the minima are 0.59.** Three classes appear, at about 1.00, 0.88
# and 0.61 times the baseline — 22 samples in the slow pair and 8 in the fast one — interleaved in time
# rather than ordered, so this is a mixed fleet and not an upgrade. The baseline below came from the
# slowest class, which is why every run sits at or below it and the measured excursion is so small.
#
# **15 is six times the widest excursion observed and thirty times the widest on a measure that is not
# quantisation-limited.** It fails a regression of 15% or more while leaving room no run has used.
#
# **What it does not cover, said rather than discovered.** A runner class *slower* than the baseline's.
# None of the thirty was. If one appears this fails, and the answer is to re-measure the baseline on it
# rather than to widen the band: a regression moves one measure and a slower machine moves all three
# together, which is what tells them apart. And a run on a *faster* class cannot fail at all, so
# `band.rs` now says when it is on one — 8 of 30 runs reported a pass that the gate had no part in.
# **This is the band for a run whose calibration matches a committed class (D-141).** A run that
# matches none is compared against the fleet instead, at `fallback_band_percent` below, which is 25
# rather than 15. The two numbers are two sensitivities and not one figure with an exception: a
# regression under 25% escapes on the fallback path, where a matched class catches it at 15%.
band_percent = 15.0

# **How close a run's calibration must be to a class's for that class to apply (H-61, issue #228).**
#
# **This was 6.0, and 6.0 was derived from a premise the measurements then falsified.** The reasoning
# was: the 30-run series put the classes at about 1.13, 1.00, 0.88 and 0.61 times the old single
# baseline, so the narrowest gap between neighbours was about 14% and 6% would separate every pair.
# Those ratios came from `chain_walk` alone, because the calibration measure did not exist yet. Measured
# with a calibration, the four classes met so far sit 6.275%, 11.658% and 24.111% apart — the narrowest
# gap is **6.275%, not 14%**.
#
# **At 6.0 two of them overlapped, and the overlap was worse than a loose band: it was a gate that
# could not pass.** A class applies when a run's calibration is within the tolerance *of that class's
# figure*, so each class owns the interval `[(1-t)·c, (1+t)·c]` and two classes stay distinct only
# while `c2/c1 > (1+t)/(1-t)`. At `t = 6%` that needs 12.766% and `cal-0872` to `cal-0926` is 6.275%,
# so their intervals met. A run reading 0.8717 ms — which is `cal-0872`'s own committed figure — fell
# inside both, matched two classes, and `band.rs` refuses an ambiguous match rather than picking one.
# The fast class would have failed every run, for ever, on a file that looked correct.
#
# **2.5 was derived to sit between two measured quantities.** It has to clear the widest run-to-run
# spread inside one class, and stay under the narrowest gap between two classes. As derived, on two
# samples of one class:
#
#     widest within-class spread, n=2       1.349%   (runs 39889325316 and 39891952477, same class)
#     narrowest observed between-class gap  6.275%   (cal-0872 to cal-0926)
#     t had to satisfy                      1.349% < t  and  (1+t)/(1-t) < 1.06275, i.e. t < 3.046%
#
# **The first line did not survive more samples, and it was flagged as thin when it was written
# (H-64, issue #243).** Over seventeen runs the widest within-class spread is **3.31%**, above the
# 3.046% ceiling the second line sets — so on those figures no value of `t` both holds a class
# together and keeps two classes apart. Both failures the original warning predicted then arrived:
# `main`'s commit 027da83 read 2.78% from its class's figure and failed, and a later run read 0.8961,
# which is +2.80% from one fast class and -3.27% from the other, a machine in the gap between two of
# them.
#
# **So 2.5 is retained rather than re-derived, and that is deliberate.** Every one of those seventeen
# readings is a *median*, and the calibration now reads the fastest sample instead. The quantity the
# tolerance has to clear is the spread of **minima**, which no run has yet produced: on the noisiest
# machine available the minimum cut the spread of twelve readings from 49.7% to 14.9%, with nine of
# the twelve inside 0.35% of one another, but a developer laptop is not the fleet. Re-deriving from
# numbers the instrument no longer takes would be the same mistake the 1.349% was. The figure stands
# until runs under this instrument say what it should be.
class_tolerance_percent = 2.5

# **How far a normalised measure may sit from the fleet ratio, on the fallback path (H-65, issue
# #245, D-141, ruled 23 October 2026).**
#
# **Why a fallback exists at all.** A class is a statement about a machine, and the fleet kept
# producing machines between the classes: a run read 0.8961, which is +2.80% from one committed class
# and -3.27% from the other, with a quotient to its own chain walk inside the band every unperturbed
# run occupies. An ordinary machine in a dead zone, reported as a defect in the diff. Narrowing the
# tolerance moves the dead zones without closing them, and widening it makes classes overlap, which
# `band.rs` refuses. So a run no class covers is compared against the fleet instead.
#
# **Why 25 and not 15.** Dividing a measure by the calibration removes machine speed — the raw
# measures span 64 to 70% across the fleet and their quotients span 18 to 21%. What it does not
# remove is the relation between Ed25519 and SHA-256, which is a property of each CPU rather than of
# how fast it is: two machines inside one class still differ by 9.8% after normalising. 25% covers the
# 18-21% that remains; 15% would fail unchanged code on machines already seen.
#
# **So this path is weaker, and by how much is the point.** A regression under 25% escapes here where
# a matched class would catch it at 15%. That is the cost of covering a machine nothing was measured
# on, and it is why this is the fallback and the classes are the rule.
#
# **The band is two-sided here, which it is not on the class path.** The calibration is the
# denominator, so a perturbed one — reading high because the runner was busy — makes every quotient
# small, and small clears an upper limit. A one-sided band would be a gate that could not fail on
# exactly the runs that most need one. The run that found this read 1.6240 ms where its own measures
# said about 0.85; its chain walk normalises to 4.89 against a fleet figure of 9.08, which is 46%
# below and well outside. Below the floor, nothing is concluded about the code.
fallback_band_percent = 25.0

# **And it fired on a busy machine, which is H-31 (#72).** Running another test suite alongside it put
# this machine at 19.73 ms against a 19.27 ms limit, with all three measures marginal — unchanged code,
# over the limit on load. A measure over its limit on a developer machine means "check what else is
# running" before it means "the code regressed", and at a 15% band it will mean that more often: the
# limit here is now 14.77 ms rather than 19.27, and a loaded machine passes 19.73 under neither.
#
# **That is a cost of calibrating, and it is paid off the runner rather than on it.** The band is
# derived from the runner's spread, so it is tight for the runner and tight for nobody else. On a
# developer machine the comparison was already meaningless in both directions — see the paragraph
# below — and is now meaningless more loudly. CI's run is the one that gates.
#
# **Run off the runner, this comparison proves nothing, and that is worth stating.** These figures are
# one machine's. The reference machine is about 1.8x faster, so `scripts/ci.sh bench-band` there measures
# below the baseline and the comparison means nothing — it would not fire on a machine faster than the
# one it is calibrated to even if it asserted. It is in `all` because `all` mirrors the push pipeline
# verbatim, and the run that matters is CI's, whose figures are the series the calibration needs. Nothing
# gates the reference machine either: since D-137, `scripts/ci.sh thresholds` measures §4.4a's figures
# there and reports them with the machine named.
#
# **Since D-141 it fails there for a new reason, and this says which so it is not read as a defect.**
# The reference laptop's calibration sometimes matches a committed class and sometimes matches none.
# When it matches none it takes the fallback, and its Ed25519-to-SHA-256 relation is lower than any the
# fleet has shown — about 7.13 where the fleet's lowest is 9.08 — so `inclusion_proof_verify` lands
# below the floor and the run reports that nothing can be concluded. That is the correct verdict for
# this machine and it is the same verdict the paragraph above describes; what changed is only which
# sentence says it.

# **One block per runner class, since H-61 (#228). The single baseline below it is the record of what
# this file held before, because it was right about the machine it came from and wrong about every
# other one.**
#
# A baseline is a statement about a machine. Holding one and comparing every run against it made two
# opposite mistakes at once:
#
#   * **a slower class failed with nothing wrong.** Four pull requests did this on 22 October. On one of
#     them the *same commit* passed its `pull_request` run at 12.81 ms and failed its `push` run at
#     14.60 ms, minutes apart on different machines — a verdict about hardware allocation, reported as a
#     verdict about the diff;
#   * **a faster class could not fail at all.** 8 of the 30 calibration runs came in at 0.59 to 0.64 of
#     the baseline, where no code change could have pushed a measure over the limit. "Every measure is
#     inside its limit" was a true sentence about a gate that had not been exercised. `band.rs` used to
#     say so in a disclosure; it no longer needs to, because such a run now has a baseline of its own.
#
# **How a class is identified: `calibration_ms`.** A fixed count of `ed25519-dalek` verifications,
# version-pinned, timed on the same instrument as the measures. It cannot be one of the three measures:
# a code regression would shift the class selection and so pick a baseline that absorbed it, and the
# gate would hide what it exists to find. Nothing in `crates/` is on the calibration's path.
#
# **The first run on an unseen class fails, and that is the design** (owner's ruling, 22 October). A
# gate that passed on hardware it has no baseline for would be reporting a comparison it did not make —
# the same defect as an absent baseline, which this file has failed on since it was written. The
# failure prints a `[class.…]` block from that run's own figures, and **that block is committed from
# that output**, which is how all but one figure in this file got here — the exception is the centred
# class below, ruled on 23 October when two machines were met 4.73% apart and neither could be
# committed beside the other. Expect one failure per class
# as the fleet is met, and no more.
#
# A class whose hardware is unchanged but whose speed moves — a kernel or microcode update — stops
# matching and fails the same way, asking for a new block. From here that is indistinguishable from new
# hardware, and it is the right failure either way.
#
# **What this file held before, and where it came from.** Measured on ubuntu-24.04, GitHub's shared
# runner, by the bench-band job of CI run 37046282848 (commit c16b6a5) — the run whose failure printed
# them, which was then and is now the only way an entry gets here. No calibration figure exists for it,
# because the calibration measure did not exist when it was taken, so it cannot become a class block
# and is kept as the record it is:
#
#     chain_walk_hash_chain_only = 12.8476
#     epoch_root_256_leaves      = 0.3685
#     inclusion_proof_verify     = 0.0041
#
# Those figures sat at the top of the slow class, within 0.5% of its median across 22 later samples. The
# first run on that class will print them again beside a calibration, and the block will say so.
#
# For scale: the reference machine does the chain walk in 7.1 ms and that runner in 12.8 ms, about 1.8x
# slower. That gap is why D-132 sent §4.4a's absolute figures to the reference machine and gave CI a band
# instead — D-136's 10 ms chain-walk threshold would have failed outright on the runner, on code that
# met it.

# **The classes, each committed from the output of the run that first printed it.**
#
# A block's name is its own `calibration_ms` with the decimal point dropped. That is deliberate: a
# class names itself from the figure that identifies it, so the name is chosen by the run rather than
# by whoever pastes it, two classes cannot collide while they are more than
# `class_tolerance_percent` apart, and nothing has to be re-ranked when a class nobody has met yet
# turns up. The comment on each block says what it was measured against.
#
# **Four classes have been met**, over six CI runs on 22-23 October 2026 (runs 39889325316,
# 39889287950, 39891954601, 39891952477, 39896365907 and 39896363146 of this pull request). The 30-run
# series had inferred four from `chain_walk` ratios alone and placed them at about 1.13, 1.00, 0.88 and
# 0.61 times the single baseline above; measured with a calibration beside them they sit at 0.61, 0.66,
# 0.80 and 1.01. **So the series' count was right and its spacing was not**, which is what the
# tolerance paragraph above had to be rewritten for.
#
# **The run-to-run spread inside one class was put at 1.349% from two samples and reached 3.31% over
# seventeen (H-64, issue #243).** Those are all medians; the calibration now reads the fastest sample,
# and the spread of minima is what the tolerance will have to clear once runs under this instrument
# have measured it.
#
# **Do not read these as a conversion table.** The calibration and the measures do not scale together
# across machines: `cal-0872` to `cal-1034` is 18.7% on the calibration and 31.0% on the chain walk,
# because Ed25519 verification and SHA-256 hashing do not depend on the same silicon. That is exactly
# why each class carries its own measured baselines instead of a figure derived from its calibration.

# **The classes are being met again under this instrument (H-64, issue #243).**
#
# Four were committed, measured on 22-23 October, and every one of them was a *median* of seven
# samples. The calibration now reads the *fastest* of those samples instead, for the reason
# `minimum_ms` gives, so those four figures describe a measure this file no longer takes. A minimum
# is never above its median and usually below it, so keeping them would not merely be untidy: a run
# would be compared against a number taken with a different instrument, and some runs would match a
# neighbouring class rather than their own. A figure that nothing measured is what this file refuses.
#
# So the fleet is met again, under the instrument that will judge it. Each class fails once and prints
# its block, which is committed from that run's own output — the same path all but one figure in this
# file has taken, and the cost of changing the instrument rather than the figures. The exception is
# the centred class below, which is marked as such where it stands.
#
# **What was here, kept as the record it is.** These are not usable as class blocks and are not
# written as blocks, so nothing can select them:
#
#     class       calibration (median)   chain_walk   epoch_root   inclusion   first met by run
#     cal-0872    0.8717                 7.8618       0.2191       0.0025      39889325316
#     cal-0926    0.9264                 8.4500       0.2331       0.0027      39896363146
#     cal-1034    1.0344                10.2976       0.2891       0.0033      39889287950
#     cal-1284    1.2838                12.9602       0.3698       0.0042      39891954601
#
# Seventeen runs under the median instrument are tabulated in issue #243, including the two that
# selected no class: one perturbed (a calibration 84% out of line with its own measures) and one
# ordinary slow-class run 2.78% from its class's committed figure. A later run read 0.8961, which is
# +2.80% from `cal-0872` and -3.27% from `cal-0926` — a genuine machine in the gap between two
# classes, which is the subject of its own issue and is not what this change addresses.

# **Slow class, and the one figure in this file that no run printed** (owner's ruling, 23 October
# 2026, H-64 issue #243). Two machines were met here and they are 4.73% apart: 1.2781 by run
# 39912334445 and 1.3386 by run 39956416735, both with ratios to their own chain walks inside the band
# every unperturbed run occupies, so both are machines rather than perturbed readings.
#
# **Neither could be committed beside the other.** At a 2.5% tolerance two classes need 5.13% between
# them or their windows meet, and `band.rs` refuses an overlapping file — so committing the second
# would have failed every run on either machine, for ever. They are one class here, centred between
# them, and each sits 2.31% from the centre, inside the window.
#
# **So a class figure is now centred rather than taken from a run, and that is a ruling and not a
# drift.** Every other figure in this file came from the output of a run that printed it, and that
# rule is what has kept the file from carrying numbers nobody measured. This entry does not: it is
# the midpoint of two measurements, and each measure below is the midpoint of that measure. The two
# runs' own figures are named above so the arithmetic can be checked, and the band it feeds is 15%
# where these sit 2.36% and 2.50% from their centres.
[class.cal-1308]
calibration_ms = 1.3083
chain_walk_hash_chain_only = 12.4464
epoch_root_256_leaves = 0.3546
inclusion_proof_verify = 0.0040

# Fastest class. First met under the minimum by run 39912327567, this pull request's `push` run. Its
# median figure was 0.8717, so the minimum reads **2.02% lower** — which is why the old blocks could
# not be kept: against a 2.5% tolerance that run would have matched its own class by 0.48 points, and
# a class whose median happened to sit higher in its range would not have matched at all.
[class.cal-0854]
calibration_ms = 0.8541
chain_walk_hash_chain_only = 7.7545
epoch_root_256_leaves = 0.2137
inclusion_proof_verify = 0.0025

# Middle class. First met under the minimum by run 39914234359. Its ratio to its own chain walk is
# 0.0931, which is the middle family's band exactly — the three families sit at about 0.109, 0.093 and
# 0.100, and that is what says this is a machine rather than a perturbed reading.
[class.cal-1052]
calibration_ms = 1.0523
chain_walk_hash_chain_only = 11.3053
epoch_root_256_leaves = 0.3182
inclusion_proof_verify = 0.0037

# **The fleet ratios: each measure divided by the calibration, over every reading taken under the
# minimum instrument (D-141).** Seven runs, 23 October 2026.
#
# **Each is the lowest quotient observed, and that is deliberate.** The upper limit is what catches a
# regression, so committing the lowest figure puts that limit as close to the fleet as the band
# allows. The highest quotient seen sits +18.3%, +20.9% and +20.7% from these, all inside 25%:
#
#     measure                      committed    from run        highest seen    which is
#     chain_walk_hash_chain_only   9.078814     39956416735     10.743419       +18.3%
#     epoch_root_256_leaves        0.250205     39912327567      0.302385       +20.9%
#     inclusion_proof_verify       0.002913     39956416735      0.003516       +20.7%
#
# Six decimal places rather than the four a class block uses: `inclusion_proof_verify` runs in about
# four microseconds, so its quotient is near 0.0029 and four places would commit two significant
# figures.
#
# These are quotients of figures runs printed, not figures a run printed itself. That is a weaker
# provenance than a class block's and it is stated rather than glossed: the arithmetic is above, and
# `band.rs` prints this block when the section is absent so a later one is pasted rather than derived.
[fallback]
chain_walk_hash_chain_only = 9.078814
epoch_root_256_leaves = 0.250205
inclusion_proof_verify = 0.002913
