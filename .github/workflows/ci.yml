# CI for CertiMining (S8). Every job calls scripts/ci.sh, so `scripts/ci.sh all` on a laptop is this
# pipeline verbatim. KAT-01 runs first, off-chain then on-chain, and every other job waits on both
# (D-09). Actions are pinned to full commit SHAs, and tools are installed with rustup and cargo (D-12).
name: ci

# `pull_request` is here because nothing tested a merge *result* (H-55, #214). A pull request's green
# tick describes its branch in isolation, and two branches that each pass can still produce a `main`
# that fails: #191 against #194 did exactly that on 22 October and left `main` red until it was
# repaired. GitHub builds the merge commit for this event, so the result is tested before it lands
# rather than after.
#
# It runs in addition to `push` rather than instead of it, so a push to a branch with an open pull
# request produces two runs — one for the pushed commit, one for the merge commit — each in its own
# concurrency group, because `github.sha` differs between them. That doubling is what testing the
# merge costs here. Narrowing `push` to `branches: [main]` would remove it and would also mean a
# branch without a pull request gets no run at all; that is a separate decision and not this one.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# **Keyed by commit rather than by ref (H-55, #214).** A ref-keyed group holds one *pending* run, and
# GitHub's run creation can lag a push by tens of minutes. The two met badly, in both directions.
#
# On `main`, where cancelling was off, each merge displaced the run queued for the merge before it,
# and a run displaced before it ever materialised left **no record at all** — not a `cancelled` row,
# nothing. Five merge commits on 22 October have no `ci` run of any kind.
#
# Off `main`, where cancelling was on, the late runs arrived out of order. On #213 the run for the
# older of two commits was created last and cancelled the run for the branch head, so the only live
# run was testing a commit that was not the head, and the tick it earned described nothing that would
# merge.
#
# A commit key cannot do either. Two runs share a group only when they are for the same commit, so
# cancelling the earlier is always correct — it is redundant work — and no run for one commit can
# cancel the run for another. What it costs: a superseded commit's run now finishes instead of being
# cancelled, which is runner minutes spent on a commit nobody will merge.
#
# H-50 (#171) is why the old key carried an exception for `main` — cancelling there killed the run for
# the commit before it, and three consecutive commits read `cancelled` on 13 October. The exception is
# gone because the key makes it unnecessary, not because that lesson stopped being true.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  kat01-offchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh kat01-offchain

  kat01-onchain:
    needs: kat01-offchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh install-agave
      - run: scripts/ci.sh kat01-onchain

  kat02:
    needs: [kat01-offchain, kat01-onchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh kat02

  vectors:
    needs: [kat01-offchain, kat01-onchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh vectors

  checks:
    needs: [kat01-offchain, kat01-onchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh checks

  # Two jobs, one per crate. Miri interprets, so this was the slowest thing in the pipeline by a wide
  # margin — 40 to 55 minutes against under five for everything else — and the two crates are separate
  # `cargo` invocations that share nothing. Splitting them halves the wait and changes no coverage.
  miri-core:
    needs: [kat01-offchain, kat01-onchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh install-miri
      - run: scripts/ci.sh miri-core

  miri-log:
    needs: [kat01-offchain, kat01-onchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh install-miri
      - run: scripts/ci.sh miri-log

  deny:
    needs: [kat01-offchain, kat01-onchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh install-cargo-deny
      - run: scripts/ci.sh deny

  # §4.4a's wall-clock half (D-132): this runner against its own committed baseline, with a band. This is
  # the only wall-clock gate left — D-137 removed §4.4a's absolutes, which are now measured and reported
  # with the machine named by `scripts/ci.sh thresholds`, run before submission rather than here.
  bench-band:
    needs: [kat01-offchain, kat01-onchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci.sh install-rust
      - run: scripts/ci.sh bench-band

  # The TypeScript verifier of E-11. It shares no code with the Rust side and needs no Rust
  # toolchain, so it depends on the KAT gate only, like every other job.
  ts:
    needs: [kat01-offchain, kat01-onchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The major line is pinned here; scripts/ci.sh prints the exact version the runner installed,
      # so the record says what ran rather than what was asked for.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: scripts/ci.sh ts
