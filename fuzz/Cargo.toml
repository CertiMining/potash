[package]
name = "certimining-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "§4.5's fuzz targets. Outside the workspace, because cargo-fuzz builds with sanitizers and a nightly toolchain the rest of the repository does not use (D-131)."

[package.metadata]
cargo-fuzz = true

[dependencies]
# The fuzzing driver, pinned like every other tool (D-11's convention). MIT OR Apache-2.0.
libfuzzer-sys = "=0.4.10"
# Structured input from arbitrary bytes, so F-03 and F-05 drive real types rather than raw buffers.
arbitrary = { version = "=1.4.2", features = ["derive"] }

certimining-core = { path = "../crates/certimining-core", features = ["native"] }
certimining-log = { path = "../crates/certimining-log", features = ["native"] }
# The program's account layouts, so F-01 can drive the decoders a counterparty's bytes actually reach.
# `no-entrypoint` keeps the Solana entrypoint out of a host build, which is how the client takes it.
certimining-checkpoint = { path = "../programs/certimining-checkpoint", features = ["no-entrypoint"] }
anchor-lang = "=1.2.0"
# F-03 signs the leaf preimage with RFC 8032 §7.1's published key, so the accepted path is reachable.
# Without it every record is refused at condition (c) and the target's accept-side assertions never
# execute — a target that looks like it checks something and cannot.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
# The proof type's sibling list is a fixed-capacity vector, so a target that builds one needs the
# same crate the engine uses rather than a std Vec.
heapless = "=0.9.3"

[[bin]]
name = "fuzz_params_decode"
path = "fuzz_targets/fuzz_params_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_canonicalize"
path = "fuzz_targets/fuzz_canonicalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_apply"
path = "fuzz_targets/fuzz_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tree_build"
path = "fuzz_targets/fuzz_tree_build.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_proof_verify"
path = "fuzz_targets/fuzz_proof_verify.rs"
test = false
doc = false
bench = false

[workspace]
